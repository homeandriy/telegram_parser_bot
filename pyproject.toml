[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-alert-monitor"
version = "0.3.2"
description = "Adaptive Telegram monitor for personal alert notifications."
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30,<1",
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "telethon>=1.39,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
ui = ["PySide6==6.8.3"]
build = ["Pillow>=10,<12", "PySide6==6.8.3", "pyinstaller>=6.10,<7"]

[project.scripts]
telegram-parser = "telegram_parser.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
